{% extends "base.html" %} 

{% block title %}Profile{% endblock %}

{% block content %}

<div class="row justify-content-center mt-4">
  <div class="col-md-6 col-lg-5">
    <div class="card bg-dark text-white border-secondary">
      <div class="card-body p-4">
        <h3 class="text-center mb-3">Profile</h3>

        <form method="POST" class="mb-4">
          <input type="hidden" name="form_type" value="profile_info">
          <div class="mb-3">
            <label class="form-label text-white lead">Username</label>
            <input type="text" class="form-control" name="username" value="{{ current_user.username }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-white lead">Email</label>
            <input type="email" class="form-control" name="email" value="{{ current_user.email }}" required>
          </div>

          <button class="btn btn-secondary w-100" type="submit">Update Profile</button>
        </form>

        <div class="mb-3">
          <div class="text-white lead">Google</div>
          {% if current_user.google_id %}
            <span class="badge bg-success">Linked</span>
          {% else %}
            <span class="badge bg-secondary">Not linked</span>
          {% endif %}
        </div>

        {% if not current_user.google_id %}
          <a class="btn btn-outline-light w-100" href="{{ url_for('auth.link_google') }}">
            Link Google account
          </a>
        {% else %}
          <button class="btn btn-outline-light w-100" type="button" disabled>
            Google account linked
          </button>
        {% endif %}

        <hr class="border-secondary my-4">

        <form method="POST">
          <input type="hidden" name="form_type" value="change_password">
          <div class="mb-3">
            <label class="form-label text-white lead">Current password</label>
            <input type="password" class="form-control" name="current_password" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-white lead">New password</label>
            <input type="password" class="form-control" name="new_password" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-white lead">Confirm new password</label>
            <input type="password" class="form-control" name="confirm_password" required>
          </div>
          <button class="btn btn-secondary w-100" type="submit">Change Password</button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
